<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un bon site internet</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: darkblue;
            text-align: center;
        }
        .myclass {
            background-color: lightyellow;
            border: 2px solid darkgreen;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        p {
            color: darkred;
        }

    </style>
</head>
<body>
    <h1>Bienvenue dans mon super site internet</h1>
    <div class="myclass">
        <p>Ceci est un paragraphe a l'intérieur de la classe "mydiv".</p>
        <p>Un autre paragraphe a l'intérieur de la même div.</p>
        <p>Encore un autre paragraphe a l'intérieur de la même div.</p>
        <p>Et un de plus pour la route !</p>
        <p>Dernier paragraphe a l'interieur de la div.</p>
        
    </div>
</body>
</html>
